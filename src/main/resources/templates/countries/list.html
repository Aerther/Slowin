<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/head :: head('Countries')}"></head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>
    
    <main>
        <ul>
            <li th:each="country : ${countries}">
                <p th:text="${country.id}">Id</p>
                <p th:text="${country.name}">Name</p>
                <p th:text="${country.capital}">Capital</p>
                <p th:text="${country.code}">Code</p>
                <p th:text="${country.flagUrl}">Flag URL</p>
                <p th:text="${country.brazilian}">Name in portuguese</p>
            </li>
        </ul>
    </main>
</body>
</html>
