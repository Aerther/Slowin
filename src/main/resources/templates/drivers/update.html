<!DOCTYPE html>
<html lang="pt-BR">
<head th:replace="~{fragments/head :: head('Atualizar Piloto')}"></head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="app-main">
        <section class="page-title-bar">
            <div>
                <div>
                    <h1>Atualizar Piloto</h1>
                    <p class="subtitle">Insira os dados para atualizar o piloto</p>
                </div>
            </div>
        </section>

        <section class="dashboard-container">
            <form th:action="@{/drivers/update}" method="post" class="app-form">
                <input type="hidden" name="id" th:value="${driver.id}" />

                <div class="form-group">
                    <label for="name">Nome do Piloto</label>
                    <input type="text" id="name" name="name" placeholder="Ex: L. Hamilton" required th:value="${driver.name}" />
                </div>

                <div class="form-group">
                    <label for="level">Nível / Rank</label>
                    <input type="number" id="level" name="level" min="1" max="99" placeholder="Ex: 1" required th:value="${driver.level}" />
                </div>

                <div class="form-group">
                    <label for="nationality">Nacionalidade</label>
                    
                    <div class="select-wrapper">
                        <select id="nationality" name="countryId" required>
                            <option value="" disabled>Selecione um país...</option>
                            <option th:each="country : ${countries}"
                                    th:value="${country.id}"
                                    th:selected="${country.id == driver.nationality.id}"
                                    th:text="${country.code + ' - ' + country.brazilian}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="team">Equipe</label>
                    
                    <div class="select-wrapper">
                        <select id="team" name="teamId" required>
                            <option value="" disabled>Selecione uma equipe...</option>
                            <option th:each="team : ${teams}" 
                                    th:value="${team.id}" 
                                    th:selected="${team.id == driver.team.id}"
                                    th:text="${team.name}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/drivers}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Salvar Piloto</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
