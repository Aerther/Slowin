<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/head :: head('New Driver')}"></head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="app-main">
        <section class="page-title-bar">
            <div>
                <div>
                    <h1>Cadastrar Novo Piloto</h1>
                    <p class="subtitle">Insira os dados para adicionar um piloto ao grid</p>
                </div>
            </div>
        </section>

        <section class="dashboard-container">
            <form th:action="@{/drivers/create}" method="post" class="app-form">
                <div class="form-group">
                    <label for="name">Nome do Piloto</label>
                    <input type="text" id="name" name="name" placeholder="Ex: L. Hamilton" required />
                </div>

                <div class="form-group">
                    <label for="level">Nível / Rank</label>
                    <input type="number" id="level" name="level" min="1" max="99" placeholder="Ex: 1" required />
                </div>

                <div class="form-group">
                    <label for="nationality">Nacionalidade</label>
                    <div class="select-wrapper">
                        <select id="nationality" name="countryId" required>
                            <option value="" disabled selected>Selecione um país...</option>
                            <option th:each="country : ${countries}" 
                                    th:value="${country.id}" 
                                    th:text="${country.code + ' - ' + country.brazilian}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="team">Equipe</label>
                    <div class="select-wrapper">
                        <select id="team" name="teamId" required>
                            <option value="" disabled selected>Selecione uma equipe...</option>
                            <option th:each="team : ${teams}" 
                                    th:value="${team.id}" 
                                    th:text="${team.name}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/drivers}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Salvar Piloto</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
